name: Dependabot auto-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no code of the pull request is checked out or run
    branches: [main]

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: tekalib/.workflows/.github/workflows/dependabot-automerge.yml@2117de4719b2b334393f9df344fd4e85d9651017 # v2.0.0
    permissions:
      contents: read
      pull-requests: read
    secrets:
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
