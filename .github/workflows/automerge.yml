name: Dependabot auto-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no code of the pull request is checked out or run
    branches: [main]

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: tekalib/.workflows/.github/workflows/dependabot-automerge.yml@9cf72126b4feae53c5b30b8a3040014d3de71d5f # v2.2.1
    permissions:
      contents: read
      pull-requests: read
    secrets:
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
