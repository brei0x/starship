name: Dependabot auto-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no code of the pull request is checked out or run
    branches: [main]

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: tekalib/.workflows/.github/workflows/dependabot-automerge.yml@5147e53dc9c5f82906fb81cb21925a0e365df6e6 # v2.2.0
    permissions:
      contents: read
      pull-requests: read
    secrets:
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
