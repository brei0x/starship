name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-toml:
    name: Validate TOML Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
          | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo

      - name: Validate starship.toml
        run: taplo check starship.toml

      - name: Format check
        run: taplo fmt --check starship.toml

  validate-starship:
    name: Validate Starship Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Starship
        run: curl -sS https://starship.rs/install.sh | sh -s -- --yes

      - name: Validate config
        run: |
          export STARSHIP_CONFIG=${{ github.workspace }}/starship.toml
          starship print-config --default false 2>&1 | tee output.txt
          if grep -qi "error\|invalid\|unknown" output.txt; then
            echo "Starship config validation failed"
            exit 1
          fi
          echo "Config is valid"

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --exclude 'file://.*wiki' '**/*.md'
          fail: true

  automerge:
    needs: [validate-toml, validate-starship, check-links]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: tekalib/.workflows/.github/workflows/dependabot-automerge.yml@1494e487e05e771c4103be2ba30ce1716dde519c # v1.1.0
    permissions:
      contents: read
      pull-requests: read
    secrets:
      app-key: ${{ secrets.AUTOMATION_APP_KEY }}

  release:
    needs: [validate-toml, validate-starship, check-links]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: tekalib/.workflows/.github/workflows/release.yml@1494e487e05e771c4103be2ba30ce1716dde519c # v1.1.0
    permissions:
      contents: write
    with:
      sha: ${{ github.sha }}
