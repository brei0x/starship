name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Tools are pinned by version and SHA-256, not installed from `latest`; Dependabot cannot bump these.
env:
  TAPLO_VERSION: 0.10.0
  TAPLO_SHA256: 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156 # taplo-linux-x86_64.gz
  STARSHIP_VERSION: v1.27.0
  STARSHIP_SHA256: 10c8eb4cb3b761d9bf59ea828444c2dab36c900b7d69a69e08814b286969df89 # x86_64-unknown-linux-musl
  STARSHIP_SHA256_MACOS: 5362da8cb2928f98f3ce0ffda697cf0f8de70081db000dae316d6d3a404f6cf0 # aarch64-apple-darwin
  STARSHIP_SHA256_WINDOWS: 7764f861805376af2812dd78c84fadc16b714cf3f346baed9b597bfda8484403 # x86_64-pc-windows-msvc
  ZIZMOR: zizmor==1.31.1
  CHECK_JSONSCHEMA: check-jsonschema==0.38.2

jobs:
  checks:
    name: Checks (TOML syntax · format · Starship config · issue forms · links · workflow audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install taplo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/taplo.gz" \
            "https://github.com/tamasfe/taplo/releases/download/$TAPLO_VERSION/taplo-linux-x86_64.gz"
          echo "$TAPLO_SHA256  $RUNNER_TEMP/taplo.gz" | sha256sum -c -
          gzip -d "$RUNNER_TEMP/taplo.gz"
          install -m 755 "$RUNNER_TEMP/taplo" /usr/local/bin/taplo
          taplo --version

      - name: Validate starship.toml
        run: taplo check starship.toml

      - name: Format check
        run: taplo fmt --check starship.toml

      - name: Install Starship
        run: |
          curl -fsSL -o "$RUNNER_TEMP/starship.tar.gz" \
            "https://github.com/starship/starship/releases/download/$STARSHIP_VERSION/starship-x86_64-unknown-linux-musl.tar.gz"
          echo "$STARSHIP_SHA256  $RUNNER_TEMP/starship.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/starship.tar.gz" -C "$RUNNER_TEMP" starship
          install -m 755 "$RUNNER_TEMP/starship" /usr/local/bin/starship
          starship --version

      - name: Validate config
        run: |
          export STARSHIP_CONFIG="$GITHUB_WORKSPACE/starship.toml"
          # Starship exits 0 on a rejected key or value: it only reports it on stderr.
          starship print-config 2> "$RUNNER_TEMP/warnings.txt" > /dev/null
          if [ -s "$RUNNER_TEMP/warnings.txt" ]; then
            cat "$RUNNER_TEMP/warnings.txt"
            echo "Starship config validation failed"
            exit 1
          fi
          echo "Config is valid"

      # This repository's forms replace the account's, so a broken one would silently fall back to
      # GitHub's blank issue here.
      - name: Validate issue forms
        run: >-
          find .github/ISSUE_TEMPLATE -name '*.yml' ! -name config.yml
          -exec pipx run "$CHECK_JSONSCHEMA" --builtin-schema vendor.github-issue-forms {} +

      - name: Validate issue config
        run: pipx run "$CHECK_JSONSCHEMA" --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml

      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --exclude 'file://.*wiki' '**/*.md'
          fail: true

      - run: pipx run "$ZIZMOR" --format github .github
        env:
          GH_TOKEN: ${{ github.token }} # online audits: impostor commits, SHA and tag mismatches

  prompt:
    name: Tests (prompt · ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: starship-x86_64-unknown-linux-musl.tar.gz
            sha: STARSHIP_SHA256
          - os: macos-latest
            asset: starship-aarch64-apple-darwin.tar.gz
            sha: STARSHIP_SHA256_MACOS
          - os: windows-latest
            asset: starship-x86_64-pc-windows-msvc.zip
            sha: STARSHIP_SHA256_WINDOWS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Starship and the shells
        env:
          ASSET: ${{ matrix.asset }}
          SHA: ${{ env[matrix.sha] }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/starship/starship/releases/download/$STARSHIP_VERSION/$ASSET"
          sum=sha256sum; command -v sha256sum > /dev/null || sum="shasum -a 256" # macOS has only shasum, Git Bash only sha256sum
          echo "$SHA  $RUNNER_TEMP/$ASSET" | $sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          case $ASSET in
            *.zip) unzip -q -o "$RUNNER_TEMP/$ASSET" starship.exe -d "$RUNNER_TEMP/bin" ;;
            *) tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/bin" starship ;;
          esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          case $RUNNER_OS in
            Linux) sudo apt-get update -qq && sudo apt-get install -qq -y zsh fish > /dev/null ;;
            macOS) brew install --quiet fish ;;
          esac

      - name: Test the prompt
        run: sh scripts/test-prompt.sh "$RUNNER_TEMP/captures"

      # sudo keeps the user's SSH-free environment; Windows runners are elevated already.
      - name: Test the prompt as root
        if: runner.os != 'Windows'
        run: sudo -E env "PATH=$PATH" sh scripts/test-prompt.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prompt-${{ runner.os }}
          path: ${{ runner.temp }}/captures

  # The one check the Trunk Merge Flow ruleset requires, same name in every repository: it needs
  # every other job. always(), because a job skipped after a failed need reports success.
  ci-passed:
    name: CI passed
    needs: [checks, prompt]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  release:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: tekalib/.workflows/.github/workflows/release.yml@5147e53dc9c5f82906fb81cb21925a0e365df6e6 # v2.2.0
    permissions:
      contents: write
    with:
      sha: ${{ github.sha }}
