# Dependabot updates. Security PRs ignore this schedule, the PR limit and the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '10:00'
      timezone: Europe/Paris
    cooldown: # a hijacked release is usually pulled within days; never be its first install
      default-days: 7
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
